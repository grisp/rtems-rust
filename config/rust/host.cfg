# Keep the SDK's four native build hosts. Host overrides are useful for RSB
# source-prefetch/dry-run checks; the bootstrap itself remains a native build.
%if %{defined with_rust_host}
 %define rust_host %{with_rust_host}
%else
 %if %{_host_os} == linux
  %if %{_host_cpu} == x86_64
   %define rust_host x86_64-unknown-linux-gnu
  %endif
  %if %{_host_cpu} == aarch64
   %define rust_host aarch64-unknown-linux-gnu
  %endif
 %endif
 %if %{_host_os} == darwin
  %if %{_host_cpu} == x86_64
   %define rust_host x86_64-apple-darwin
  %endif
  %if %{_host_cpu} == arm64
   %define rust_host aarch64-apple-darwin
  %endif
  %if %{_host_cpu} == aarch64
   %define rust_host aarch64-apple-darwin
  %endif
 %endif
%endif
%ifn %{defined rust_host}
 %error Rust SDK supports Linux/macOS x86_64 and AArch64 hosts only
%endif
%include rust/stage0-%{rust_host}.cfg
