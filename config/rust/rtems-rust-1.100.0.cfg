%include base.cfg
%include rust/host.cfg
%include rust/sources.cfg
%if %{rust_target} == armv7-rtems-eabihf
 # Match the built-in target's ARMv7-A, NEON/VFPv3 and hard-float ABI.
 %define rust_target_cflags -march=armv7-a -mfpu=neon -mfloat-abi=hard
%else
 %error No target C flags are defined for this Rust RTEMS target
%endif
%include rust/rust-common.cfg
