Name: rtems-rust-%{rust_host}-%{rust_version}
Summary: Source-built Rust, Cargo, LLVM and RTEMS target std
Version: %{rust_version}
Release: %{release}
URL: https://www.rust-lang.org/

%define rust_workdir %{_topdir}/build/rtems-rust-%{rust_host}-%{rust_version}
%if %{defined with_rust_reuse}
 # RSB recreates _builddir before executing prep. Keep that scratch directory
 # separate from the retained source, compiler, LLVM and Cargo object trees.
 %define _builddir %{_topdir}/rsb/rtems-rust-%{rust_host}-%{rust_version}
 %define rust_reuse_option --reuse
%else
 %define rust_reuse_option %{nil}
%endif
%if %{rust_errno} == __errno
 %define rust_errno_environment RUSTC_STD_RTEMS_NEWLIB_NO_TLS_ERRNO=1
%else
 %define rust_errno_environment %{nil}
%endif

%prep
 %if %{defined with_rust_reuse}
  rust_source_dir="%{rust_workdir}/rustc-%{rust_version}-src"
  rust_libc_dir="%{rust_workdir}/libc-%{rust_libc_base}"
 %else
  %source setup rust -q -n rustc-%{rust_version}-src
  %patch setup rust -p1
  rust_source_dir=$(pwd)
  %source setup libc -q -n libc-%{rust_libc_base}
  %patch setup libc -p1
  rust_libc_dir=$(pwd)
  %source setup stage0-rustc -q -n rustc-%{rust_stage0_version}-%{rust_host}
  sh install.sh --prefix="%{_builddir}/stage0" --disable-ldconfig
  %source setup stage0-rust-std -q -n rust-std-%{rust_stage0_version}-%{rust_host}
  sh install.sh --prefix="%{_builddir}/stage0" --disable-ldconfig
  %source setup stage0-cargo -q -n cargo-%{rust_stage0_version}-%{rust_host}
  sh install.sh --prefix="%{_builddir}/stage0" --disable-ldconfig
 %endif
  cd "$rust_source_dir"
  python3 "%{rust_project}/tools/bootstrap-config" \
    --host "%{rust_host}" --target "%{rust_target}" \
    --prefix "%{_prefix}" --stage0 "%{rust_workdir}/stage0" \
    --c-target "%{rust_c_target}" --c-prefix "%{with_rust_c_prefix}" --errno "%{rust_errno}" \
    --libc "$rust_libc_dir" --jobs %{with_rust_jobs} \
    --target-cflags="%{rust_target_cflags}" %{rust_reuse_option}

%build
  cd "$rust_source_dir"
  . ./rtems-rust-env.sh
  # Resolve the std workspace path patch before locking all bootstrap builds.
  # The std manifest uses profile-rustflags, including with stable stage0 Cargo.
  python3 "%{rust_project}/tools/build-env" \
    --cargo-home "%{rust_workdir}/cargo-home" --target-dir "%{rust_workdir}/cargo-target" \
    --jobs %{with_rust_jobs} -- env RUSTC_BOOTSTRAP=1 \
    "%{rust_workdir}/stage0/bin/cargo" update --offline \
    --manifest-path library/Cargo.toml -p libc --precise %{rust_libc_version}
  python3 "%{rust_project}/tools/build-env" \
    --cargo-home "%{rust_workdir}/cargo-home" --target-dir "%{rust_workdir}/cargo-target" \
    --jobs %{with_rust_jobs} -- env %{rust_errno_environment} ./x build --stage 2 library src/tools/cargo

%install
  cd "$rust_source_dir"
  python3 "%{rust_project}/tools/build-env" \
    --cargo-home "%{rust_workdir}/cargo-home" --target-dir "%{rust_workdir}/cargo-target" \
    --jobs %{with_rust_jobs} -- env %{rust_errno_environment} DESTDIR="$SB_BUILD_ROOT" ./x install --stage 2
  python3 "%{rust_project}/tools/install-support" core \
    --prefix "$SB_BUILD_ROOT%{_prefix}" --host "%{rust_host}" \
    --target "%{rust_target}" --rtems-major %{rust_rtems_major} \
    --c-target "%{rust_c_target}" --errno "%{rust_errno}" \
    --bootstrap-inputs "$rust_source_dir/.rtems-rust-inputs.json" \
    --target-cflags="%{rust_target_cflags}"
