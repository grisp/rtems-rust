%include base.cfg
%include rust/host.cfg
%include rust/sources.cfg
%include rust/nif-sources.cfg

Name: rtems-rust-nif-support-%{rust_host}-0.39.0
Summary: Static Rustler bundler and versioned patched NIF source inputs
Version: 0.39.0
Release: %{release}
URL: https://github.com/rusterlium/rustler

%include rust/nif-vendor-prep.cfg

%prep
  %source setup rustler -q -n rustler-%{rust_rustler_base}
  %patch setup rustler -p1
  rustler_source_dir=$(pwd)
  %source setup inventory -q -n inventory-%{rust_inventory_base}
  %patch setup inventory -p1
  inventory_source_dir=$(pwd)
  %source setup libc -q -n libc-%{rust_libc_base}
  %patch setup libc -p1
  libc_source_dir=$(pwd)
  nif_vendor_dir="%{_builddir}/rust-nif-vendor"
  python3 "%{rust_project}/tools/install-support" vendor --prefix "$nif_vendor_dir"
  cd "$rustler_source_dir"
  cp "%{rust_project}/config/rust/nif.Cargo.lock" Cargo.lock
  mkdir -p .cargo
  cat > .cargo/config.toml << EOF
  [source.crates-io]
  replace-with = "sdk-vendor"
  [source.sdk-vendor]
  directory = "$nif_vendor_dir"
  [patch.crates-io]
  inventory = { path = "$inventory_source_dir" }
  EOF

%build
  cd "$rustler_source_dir"
  export PATH="%{_prefix}/bin:$PATH"
  python3 "%{rust_project}/tools/build-env" \
    --cargo-home "%{_builddir}/cargo-home" --target-dir "%{_builddir}/nif-target" \
    --jobs %{with_rust_jobs} --rustc "%{_prefix}/bin/rustc" -- \
    "%{_prefix}/bin/cargo" build --frozen --release -p rustler_bundler

%install
  mkdir -p "$SB_BUILD_ROOT%{_prefix}/bin"
  cp "%{_builddir}/nif-target/release/rustler-bundler" "$SB_BUILD_ROOT%{_prefix}/bin/"
  python3 "%{rust_project}/tools/install-support" nif \
    --prefix "$SB_BUILD_ROOT%{_prefix}" --core-prefix "%{_prefix}" --rustler "$rustler_source_dir" \
    --inventory "$inventory_source_dir" --libc "$libc_source_dir" --vendor "$nif_vendor_dir"
